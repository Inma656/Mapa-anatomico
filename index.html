<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Anatómico Multicapa 3D - Mano</title>
    <script src="https://unpkg.com/3d-force-graph"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #000; }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: none; /* Deja que el ratón interactúe con el modelo 3D de fondo */
            z-index: 10;
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        p { margin: 0; font-size: 14px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); color: #ccc; }
        #leyenda { margin-top: 15px; font-size: 12px; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Atlas Anatómico Multicapa 3D</h1>
        <p>🖱️ <b>Arrastra</b> para rotar la cámara. <b>Rueda</b> para hacer zoom.</p>
        <p>👆 <b>Haz clic en los nodos</b> para descubrir conexiones en diferentes niveles.</p>
        
        <div id="leyenda">
            <div><span class="dot" style="background: #e74c3c;"></span> Acupuntura (Piso Superior)</div>
            <div><span class="dot" style="background: #f39c12;"></span> Nervios / Músculos (Piso Medio)</div>
            <div><span class="dot" style="background: #3498db;"></span> Huesos (Piso Inferior)</div>
        </div>
    </div>

    <div id="3d-graph"></div>

<script>
    // 1. BASE DE DATOS GEOMÉTRICA (Coordenadas Fijas para dar forma de mano)
    const masterNodes = [
        // --- PISO 1: HUESOS (z: -80) ---
        { id: 'carpo', label: 'Carpo (Muñeca)', group: 'hueso', fx: 0, fy: 0, fz: -80 },
        
        // Pulgar (Dedo 1)
        { id: 'meta1', label: '1º Metacarpiano', group: 'hueso', fx: -35, fy: 20, fz: -80 },
        { id: 'fal1_prox', label: 'Falange Proximal (Pulgar)', group: 'hueso', fx: -50, fy: 40, fz: -80 },
        
        // Índice (Dedo 2)
        { id: 'meta2', label: '2º Metacarpiano', group: 'hueso', fx: -15, fy: 35, fz: -80 },
        { id: 'fal2_prox', label: 'Falange Proximal (Índice)', group: 'hueso', fx: -18, fy: 70, fz: -80 },
        
        // Medio (Dedo 3)
        { id: 'meta3', label: '3º Metacarpiano', group: 'hueso', fx: 0, fy: 40, fz: -80 },
        { id: 'fal3_prox', label: 'Falange Proximal (Medio)', group: 'hueso', fx: 0, fy: 80, fz: -80 },
        
        // Anular (Dedo 4)
        { id: 'meta4', label: '4º Metacarpiano', group: 'hueso', fx: 15, fy: 35, fz: -80 },
        { id: 'fal4_prox', label: 'Falange Proximal (Anular)', group: 'hueso', fx: 18, fy: 70, fz: -80 },
        
        // Meñique (Dedo 5)
        { id: 'meta5', label: '5º Metacarpiano', group: 'hueso', fx: 30, fy: 25, fz: -80 },
        { id: 'fal5_prox', label: 'Falange Proximal (Meñique)', group: 'hueso', fx: 35, fy: 55, fz: -80 },

        // --- PISO 2: MÚSCULOS Y NERVIOS (z: 0) ---
        { id: 'eminencia_tenar', label: 'Eminencia Tenar', group: 'musculo', fx: -25, fy: 15, fz: 0 },
        { id: 'nervio_mediano', label: 'Nervio Mediano', group: 'nervio', fx: 0, fy: 10, fz: 0 },
        { id: 'lumbrical2', label: '2º Lumbrical', group: 'musculo', fx: -8, fy: 50, fz: 0 },

        // --- PISO 3: ACUPUNTURA (z: 80) ---
        { id: 'pc8', label: 'PC8 (Laogong)', group: 'acupuntura', fx: 0, fy: 30, fz: 80 },
        { id: 'li4', label: 'LI4 (Hegu)', group: 'acupuntura', fx: -25, fy: 35, fz: 80 }
    ];

    const masterLinks = [
        // Articulaciones óseas
        { source: 'carpo', target: 'meta1', label: '' },
        { source: 'carpo', target: 'meta2', label: '' },
        { source: 'carpo', target: 'meta3', label: '' },
        { source: 'carpo', target: 'meta4', label: '' },
        { source: 'carpo', target: 'meta5', label: '' },
        { source: 'meta1', target: 'fal1_prox', label: '' },
        { source: 'meta2', target: 'fal2_prox', label: '' },
        { source: 'meta3', target: 'fal3_prox', label: '' },
        { source: 'meta4', target: 'fal4_prox', label: '' },
        { source: 'meta5', target: 'fal5_prox', label: '' },

        // Conexiones transversales (Multicapa)
        { source: 'eminencia_tenar', target: 'meta1', label: 'Cubre' },
        { source: 'nervio_mediano', target: 'lumbrical2', label: 'Inerva' },
        { source: 'nervio_mediano', target: 'carpo', label: 'Cruza túnel carpiano' },
        { source: 'pc8', target: 'meta3', label: 'Sobre el hueso' },
        { source: 'li4', target: 'eminencia_tenar', label: 'Sobre el músculo' }
    ];

    // 2. ESTADO INICIAL (Mostramos todos los huesos de golpe para ver la forma de la mano)
    let visibleNodes = masterNodes.filter(n => n.group === 'hueso');
    let visibleLinks = masterLinks.filter(l => 
        visibleNodes.find(n => n.id === l.source) && 
        visibleNodes.find(n => n.id === l.target)
    );

    const getId = (nodeOrString) => typeof nodeOrString === 'object' ? nodeOrString.id : nodeOrString;

    // 3. CONFIGURACIÓN DEL ESPACIO 3D
    const Graph = ForceGraph3D()
        (document.getElementById('3d-graph'))
        .graphData({ nodes: visibleNodes, links: visibleLinks })
        .nodeLabel('label') // Muestra el cartelito solo al pasar el ratón
        .nodeColor(node => {
            if (node.group === 'hueso') return '#3498db'; 
            if (node.group === 'musculo' || node.group === 'nervio') return '#f39c12'; 
            if (node.group === 'acupuntura') return '#e74c3c'; 
            return '#ffffff';
        })
        .linkColor(() => 'rgba(255,255,255,0.4)')
        .linkWidth(1.5)
        .backgroundColor('#111418') 
        
        // 4. LA MAGIA DE EXPANSIÓN AL HACER CLIC
        .onNodeClick(node => {
            let changesMade = false;

            masterLinks.forEach(link => {
                const sourceId = getId(link.source);
                const targetId = getId(link.target);

                if (sourceId === node.id || targetId === node.id) {
                    
                    const linkExists = visibleLinks.find(l => getId(l.source) === sourceId && getId(l.target) === targetId);
                    
                    if (!linkExists) {
                        visibleLinks.push(link);
                        changesMade = true;
                    }

                    const neighborId = sourceId === node.id ? targetId : sourceId;
                    if (!visibleNodes.find(n => n.id === neighborId)) {
                        visibleNodes.push(masterNodes.find(n => n.id === neighborId));
                        changesMade = true;
                    }
                }
            });

            if (changesMade) {
                Graph.graphData({ nodes: [...visibleNodes], links: [...visibleLinks] });
            }

            // Animación cinematográfica ajustada para coordenadas fijas
            const distance = 150;
            const distRatio = 1 + distance/Math.hypot(node.fx || node.x, node.fy || node.y, node.fz || node.z);
            Graph.cameraPosition(
                { x: (node.fx || node.x) * distRatio, y: (node.fy || node.y) * distRatio, z: Math.max(200, (node.fz || node.z) * distRatio) },
                node, 
                1500  
            );
        });

</script>
</body>
</html>
